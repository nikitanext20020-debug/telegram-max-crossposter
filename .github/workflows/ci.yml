name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -W error::DeprecationWarning
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: docker build -t telegram-max-crossposter:ci .
