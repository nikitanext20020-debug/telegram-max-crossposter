services:
  - type: web
    name: telegram-max-crossposter
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MAX_BOT_TOKEN
        sync: false
      - key: MAX_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_SOURCE_CHAT_IDS
        value: ""
      - key: MAX_SIGNATURE_TEXT
        value: "ЛУЧШИЙ ВПН (БЕСПЛАТНО)"
      - key: MAX_SIGNATURE_URL
        value: "https://nosokvpn.com/?ref=p1_UAkMu8To0LPBeXr55PI"
      - key: MAX_NOTIFY
        value: "true"
      - key: MAX_DISABLE_LINK_PREVIEW
        value: "false"
      - key: MAX_API_BASE
        value: "https://platform-api2.max.ru"
